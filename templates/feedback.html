<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback - Home Value AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .feedback-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1d4ed8;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        select:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="feedback-container">

        <div class="header">
            <h1>⭐ Share Your Feedback</h1>
            <p>Help us improve your Home Value AI experience.</p>
        </div>

        <form action="/feedback" method="POST">

            <div class="form-group">
                <label for="rating">Rating</label>

                <select name="rating" id="rating" required>

                    <option value="">Select Rating</option>

                    <option value="5">★★★★★ - Excellent</option>

                    <option value="4">★★★★ - Very Good</option>

                    <option value="3">★★★ - Good</option>

                    <option value="2">★★ - Average</option>

                    <option value="1">★ - Poor</option>

                </select>
            </div>


            <div class="form-group">

                <label for="message">Your Feedback</label>

                <textarea
                    name="message"
                    id="message"
                    placeholder="Write your feedback here..."
                    required></textarea>

            </div>


            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>

        </form>


        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
