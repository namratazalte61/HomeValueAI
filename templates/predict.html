<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction | Home Value AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d6efd;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .prediction-container {
            max-width: 750px;
            margin: 50px auto;
        }

        .prediction-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .title {
            color: #0d6efd;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-predict {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
        }

        .btn-predict:hover {
            background: #0b5ed7;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            🏠 Home Value AI
        </a>
    </div>
</nav>

<div class="prediction-container">

    <div class="prediction-card">

        <h2 class="title">
            🏠 House Price Prediction
        </h2>

        <form action="/predict" method="POST">

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input
                    type="text"
                    name="location"
                    class="form-control"
                    placeholder="Enter location"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Area (sq ft)</label>
                <input
                    type="number"
                    name="area"
                    class="form-control"
                    placeholder="Enter area"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Rooms</label>
                <input
                    type="number"
                    name="rooms"
                    class="form-control"
                    placeholder="Enter rooms"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Bedrooms</label>
                <input
                    type="number"
                    name="bedrooms"
                    class="form-control"
                    placeholder="Enter bedrooms"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Bathrooms</label>
                <input
                    type="number"
                    name="bathrooms"
                    class="form-control"
                    placeholder="Enter bathrooms"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">Property Type</label>

                <select name="property_type" class="form-select" required>
                    <option value="">Select property type</option>
                    <option value="Flat">Flat</option>
                    <option value="House">House</option>
                    <option value="Villa">Villa</option>
                    <option value="Studio">Studio</option>
                </select>
            </div>

            <button type="submit" class="btn-predict">
                🤖 Predict House Price
            </button>

        </form>

        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
