<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Home Value AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1769e0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            background: #1769e0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #0d55bd;
            color: white;
        }

        /* ADMIN LOGIN */

        .admin-login {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .admin-login p {
            color: #64748b;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .admin-login a {
            text-decoration: none;
            color: #dc3545;
            font-weight: 600;
        }

        .admin-login a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            text-decoration: none;
            color: #1769e0;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        🏠 Home Value AI
    </div>

    <p class="subtitle">
        Login to your account
    </p>

    <form action="/login" method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-login"
        >
            Login
        </button>

    </form>


    <!-- ADMIN LOGIN -->

    <div class="admin-login">

        <p>
            Are you an administrator?
        </p>

        <a href="{{ url_for('admin_login') }}">
            🔐 Admin Login
        </a>

    </div>


    <div class="back-home">

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
