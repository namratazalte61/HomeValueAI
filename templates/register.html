<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Home Value AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 30px 0;
        }

        .register-card {
            background: white;
            width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1769e0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            width: 100%;
            background: #1769e0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #0d55bd;
            color: white;
        }

        .bottom-link {
            text-align: center;
            margin-top: 20px;
        }

        .bottom-link a {
            text-decoration: none;
            color: #1769e0;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">🏠 Home Value AI</div>

    <p class="subtitle">Create your account</p>

    <!-- Registration Form -->
    <form action="/register" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>

            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Create a password"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>

            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm your password"
                   required>
        </div>

        <button type="submit" class="btn-register">
            Create Account
        </button>

    </form>

    <div class="bottom-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

    <div class="bottom-link">
        <a href="/">← Back to Home</a>
    </div>

</div>

</body>
</html>
